# ==============================================================================
# 2. CẤU HÌNH CHẾ ĐỘ CƯỜNG HÓA TRANG BỊ & CỔ NGỮ ĐỘC QUYỀN
# ==============================================================================
equipment-upgrader:
  # Giới hạn số lượng thuộc tính bổ sung tối đa trên 1 món trang bị (Cân bằng game)
  max-custom-attributes: 3
  # Giới hạn số lượng Cổ Ngữ Độc Quyền tối đa trên 1 món trang bị
  max-native-enchants: 3
  # Cấp độ tối đa của mỗi dòng thuộc tính bổ sung
  max-attribute-level: 10
  # Mỗi lần nâng cấp thất bại trang bị sẽ KHÔNG bị mất mà tích lũy thêm % May Mắn (Pity)
