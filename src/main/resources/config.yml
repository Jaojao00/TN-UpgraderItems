# ==============================================================================
#                        TN-UPGRADER ITEMS (PAPER 1.21+)
#                      Tác giả (Author): Tài Nguyễn
#   Hệ thống Đấu Giá Nâng Đời Vật Phẩm & Cường Hóa Trang Bị End-Game Độc Đáo
# ==============================================================================

settings:
  prefix: "&8[&6&lTN-Upgrader&8] &r"
  # Cho phép mở trực tiếp bằng lệnh /nangcap hoặc bắt buộc dùng Khối/Công cụ Nâng Cấp
  require-block-or-tool: false
  # Tỷ lệ thành công tối đa (%) cho phép trong một lần quay
  max-success-chance: 100.0
  # Hệ số cân bằng (1.0 = đúng 100% tỷ lệ theo giá trị V như ảnh mẫu; 0.95 = trừ 5% phí sàn)
  chance-multiplier: 1.0
  # Thông báo toàn server khi người chơi nâng cấp trúng vật phẩm giá trị cao hoặc tỷ lệ thấp
  broadcast-min-value: 4000.0
  broadcast-max-chance: 35.0
  # Tự động tối ưu hóa thao tác 1-chạm cho người chơi PE (Bedrock/Floodgate) và PC
  pe-one-tap-mode: true

# ==============================================================================
# 1. CHẾ TẠO KHỐI CHỨC NĂNG & CÔNG CỤ NÂNG CẤP (VÀNG + KIM CƯƠNG + ĐE)
# ==============================================================================
crafting:
  upgrader-block:
    enabled: true
    material: ANVIL
    name: "&6&l⚒ ĐÀI NÂNG CẤP TỐI THƯỢNG ⚒"
    lore:
      - "&7Khối chức năng đặc biệt kết tinh từ"
      - "&eVàng&7, &bKim Cương &7và &fĐe Rèn Cổ Đại&7."
      - ""
      - "&6▸ Công dụng:"
      - "&f  Đặt xuống đất và &eChuột Phải (Chạm)"
      - "&f  để mở giao diện &6Nâng Cấp Vật Phẩm"
      - "&f  & Cường Hóa Trang Bị End-Game!"
      - ""
      - "&8[TN-UpgraderItems - Tài Nguyễn]"
    # Công thức chế tạo 3x3: G = GOLD_INGOT, D = DIAMOND, A = ANVIL, B = GOLD_BLOCK
    shape:
      - "GDG"
      - "DAD"
      - "GBG"
    ingredients:
      G: GOLD_INGOT
      D: DIAMOND
      A: ANVIL
      B: GOLD_BLOCK

  portable-tool:
    enabled: true
    material: ENCHANTED_BOOK
    name: "&e&l⚙ SỔ TAY NÂNG CẤP DI ĐỘNG ⚙"
    lore:
      - "&7Công cụ ma thuật thu nhỏ của Đài Nâng Cấp."
      - "&7Giúp bạn nâng cấp vật phẩm mọi lúc mọi nơi!"
      - ""
      - "&6▸ Thao tác (PC & PE):"
      - "&f  Cầm trên tay và &eChuột Phải / Chạm giữ"
      - "&f  để mở nhanh &6Nâng Cấp Vật Phẩm&f!"
      - ""
      - "&8[TN-UpgraderItems - Tài Nguyễn]"
    shape:
      - " G "
      - "DAD"
      - " G "
    ingredients:
      G: GOLD_INGOT
      D: DIAMOND
      A: BOOK

# ==============================================================================
# 2. CẤU HÌNH CHẾ ĐỘ CƯỜNG HÓA TRANG BỊ END-GAME (THUỘC TÍNH & PHÙ PHÉP)
# ==============================================================================
equipment-upgrader:
  # Giới hạn số lượng thuộc tính bổ sung tối đa trên 1 món trang bị (Cân bằng game)
  max-custom-attributes: 3
  # Cấp độ tối đa của mỗi dòng thuộc tính bổ sung
  max-attribute-level: 10
  # Mỗi lần nâng cấp thất bại trang bị sẽ KHÔNG bị mất mà tích lũy thêm % May Mắn (Pity)
  pity-bonus-per-fail: 3.5
  max-pity-bonus: 35.0
  # Điểm nguyên liệu (V) yêu cầu cho Cấp 1 (nhân theo cấp độ tiếp theo)
  base-upgrade-cost-v: 500.0
  cost-multiplier-per-level: 1.55

  # Cấu hình chi tiết các dòng thuộc tính End-Game
  attributes:
    ATTACK_DAMAGE:
      enabled: true
      name: "&c⚔ Sát Thương Tấn Công"
      per-level: 1.5
      unit: " Sát thương"
      icon: NETHERITE_SWORD
      description: "Tăng sát thương cận chiến trực tiếp lên mục tiêu"
    MAX_HEALTH:
      enabled: true
      name: "&d❤ Sinh Lực Tối Đa"
      per-level: 2.0
      unit: " Máu (1 Tim)"
      icon: GOLDEN_APPLE
      description: "Tăng giới hạn máu tối đa khi mặc/cầm trang bị"
    ARMOR:
      enabled: true
      name: "&b🛡 Giáp Phòng Thủ"
      per-level: 1.5
      unit: " Giáp"
      icon: DIAMOND_CHESTPLATE
      description: "Tăng chỉ số giáp giảm sát thương vật lý"
    ARMOR_TOUGHNESS:
      enabled: true
      name: "&3💎 Độ Cứng Giáp"
      per-level: 1.0
      unit: " Độ cứng"
      icon: NETHERITE_CHESTPLATE
      description: "Chống xuyên giáp từ các đòn đánh hạng nặng"
    ATTACK_SPEED:
      enabled: true
      name: "&e⚡ Tốc Độ Xuất Chiêu"
      per-level: 0.12
      unit: " Tốc đánh"
      icon: GOLDEN_SWORD
      description: "Tăng tốc độ hồi đòn đánh vũ khí và công cụ"
    MOVEMENT_SPEED:
      enabled: true
      name: "&a👟 Tốc Độ Di Chuyển"
      per-level: 4.0
      unit: "% Tốc chạy"
      icon: FEATHER
      description: "Giúp di chuyển linh hoạt hơn trong giao tranh"
    LIFESTEAL:
      enabled: true
      name: "&4🩸 Hút Máu Chiến Đấu"
      per-level: 2.5
      unit: "% Hút máu"
      icon: REDSTONE
      description: "Hồi máu theo % sát thương gây ra cho kẻ địch/Boss"
    CRIT_STRIKE:
      enabled: true
      name: "&6💥 Bạo Kích Huỷ Diệt"
      per-level: 4.0
      unit: "% Tỉ lệ chí mạng (x1.5 DMG)"
      icon: BLAZE_POWDER
      description: "Xác suất nổ đòn chí mạng x1.5 sát thương kèm hiệu ứng"
    TRUE_DAMAGE:
      enabled: true
      name: "&5🔥 Sát Thương Chuẩn (Xuyên Giáp)"
      per-level: 1.0
      unit: " Sát thương chuẩn"
      icon: NETHER_STAR
      description: "Gây sát thương bỏ qua hoàn toàn giáp của đối phương & MythicMobs"

  # Cấu hình nâng cấp Phù Phép (Hỗ trợ cả Vanilla & ExcellentEnchants 1.21+)
  enchant-upgrader:
    enabled: true
    # Cho phép nâng cấp vượt giới hạn cấp độ mặc định thêm bao nhiêu cấp (VD: Sharpness V -> VIII)
    over-max-level-bonus: 3
    base-enchant-cost-v: 600.0

# ==============================================================================
# 3. TÍCH HỢP PLUGIN HỖ TRỢ (MYTHICMOBS & EXCELLENTENCHANTS)
# ==============================================================================
hooks:
  mythicmobs:
    enabled: true
    # Giá trị mặc định (V) cho các vật phẩm MythicMobs khi đặt làm đồ cược
    default-mythic-item-value: 1500.0
    # Danh sách vật phẩm MythicMobs xuất hiện trong kho "Tìm Phần Thưởng"
    # Định dạng: <Tên_Item_MythicMobs>: <Giá_Trị_V>
    items:
      SkeletonKingSword: 12000.0
      CrownOfTheKing: 8500.0
      MythicUpgradeStone: 2500.0

  excellentenchants:
    enabled: true
    # Tự động quét các phù phép custom từ ExcellentEnchants đưa vào kho phần thưởng & cường hóa
    include-books-in-reward-browser: true
    base-custom-book-value: 1800.0

