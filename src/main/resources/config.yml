# ==============================================================================
#                        TN-UPGRADER ITEMS (PAPER 1.21+)
#                      Tác giả (Author): Tài Nguyễn
#   Hệ thống Đấu Giá Nâng Đời Vật Phẩm & Cường Hóa Trang Bị Cổ Ngữ Độc Quyền
# ==============================================================================

settings:
  prefix: "&8[&6&lTN-Upgrader&8] &r"
  # Bắt buộc đứng gần Đài Nâng Cấp hoặc cầm Sổ Tay Nâng Cấp mới mở được bằng lệnh /nangcap
  require-block-or-tool: false
  # Trần tỉ lệ thành công tối đa (%) cho người chơi thường (Chống ăn chắc 100% cày đồ)
  # Người có quyền tnupgrader.maxchance.85 được 85%, quyền tnupgrader.bypass.chance được 100%
  max-success-chance: 75.0
  # Hệ số quy đổi tỉ lệ (0.80 = Thuế sàn 20%, chống đổi ngang giá 1:1 để cày đồ)
  chance-multiplier: 0.80
  # Thông báo toàn server khi người chơi nâng cấp trúng vật phẩm giá trị cao hoặc tỉ lệ thấp
  broadcast-min-value: 4000.0
  broadcast-max-chance: 35.0
  # Tự động tối ưu hóa thao tác 1-chạm cho người chơi PE (Bedrock/Floodgate) và PC
  pe-one-tap-mode: true

# ==============================================================================
# 🛡️ HỆ THỐNG CHỐNG LỢI DỤNG CÀY ĐỒ & GIỚI HẠN NGƯỜI CHƠI (ANTI-ABUSE)
# ==============================================================================
anti-abuse:
  # Giới hạn tổng số lượng vật phẩm tối đa được đặt vào lưới 3x3 (ĐỒ CƯỢC X/64)
  # Chặn việc nhét 9 stack (576 món) đồ rẻ tiền để gom điểm V!
  max-wager-items: 64

  # Giới hạn Số lượng đích tối đa trong 1 lần quay (VD: tối đa x3 món)
  max-target-quantity: 3

  # Giới hạn hệ số nhân mục tiêu tối đa (VD: tối đa x5 lần giá trị đang cược)
  max-upgrade-multiplier: 5

  # Tỉ lệ Đơn Giá tối thiểu của món đồ cược so với Đơn Giá vật phẩm đích (0.15 = 15%)
  # Ví dụ: Muốn đập lên Thỏi Netherite (1,656 V), mỗi món đồ đặt cược phải có đơn giá
  # tối thiểu >= 248 V (như Kim cương 250 V, Phế liệu Netherite 351 V, Đá Cường Hóa 1000 V).
  # Chặn tuyệt đối việc gom Sắt/Đồng/Than từ máy farm AFK để đập thẳng lên đồ cuối!
  min-unit-value-ratio: 0.15

  # Giới hạn số lượt quay Đấu Giá tối đa mỗi ngày của 1 người chơi thường
  # (Quyền tnupgrader.limit.30 = 30 lượt, tnupgrader.limit.50 = 50 lượt, tnupgrader.bypass.limit = Vô hạn)
  daily-wager-limit: 15

  # Thời gian chờ (giây) giữa 2 lần bấm quay liên tiếp (Chống spam / auto-clicker)
  cooldown-seconds: 8

  # Bật kiểm tra quyền mở khóa theo Bậc Giá Trị Phần Thưởng (Tier Permissions):
  # - Bậc Cao Cấp (>= 1,500 V): Yêu cầu quyền tnupgrader.tier.epic
  # - Bậc Thần Thoại (>= 10,000 V): Yêu cầu quyền tnupgrader.tier.legendary (Mặc định chỉ OP/VIP)
  require-tier-permissions: true
  epic-tier-min-value: 1500.0
  legendary-tier-min-value: 10000.0

